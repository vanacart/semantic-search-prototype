<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic Search Design Sandbox</title>
<style>
  :root { --bg:#f6f7f8; --surface:#fff; --border:#e9ecef; --text:#333; --muted:#75777c; --accent:#4a9cb7; }
  body { margin:0; padding:40px 16px; background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); font-size:14px; margin:0 0 16px; }
  ul { list-style:none; padding:0; margin:0; }
  li a { display:block; background:var(--surface); border:1px solid var(--border); border-radius:8px;
         padding:12px 16px; margin-bottom:8px; color:var(--text); text-decoration:none; font-size:14px; }
  li a:hover { border-color:var(--accent); }
  li a span { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
</style>
</head>
<body>
<main>
  <h1>Semantic Search Design Sandbox</h1>
  <ul>
    <li><a href="typeahead.html#tour">Guided tour</a></li>
    <li><a href="typeahead.html#baseline">Search results grouped by object</a></li>
  </ul>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Type-ahead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,600;0,700;1,400&family=Titillium+Web:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #333333;
    --grey: #75777c;
    --muted: #9a9ca1;
    --line: #e9ecef;
    --line-strong: #ced4da;
    --link: #4a9cb7;
    --link-dark: #2f7f99;
    --highlight: #d0e0fd;
    --hover: #f3f6fb;
    --surface: #ffffff;
    --page: #f6f7f8;
    --panel: #fbfbfc;
    --nav: #16234a;
    --brand: #e8823a;
    --works: #2e7d32;
    --watch: #c62828;
    --amber-bg: #fdf3dc;
    --amber-line: #f1dca8;
    --quest: #3c3489;
    --quest-bg: #eeedfe;
    --radius: 6px;
    --shadow: 0 8px 24px rgba(22, 35, 74, .14), 0 1px 3px rgba(22, 35, 74, .08);
    --f-head: 'Titillium Web', system-ui, sans-serif;
    --f-body: 'Libre Franklin', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 14px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .layout { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  .layout.panel-hidden { grid-template-columns: 1fr; }
  .layout.panel-hidden .panel { display: none; }

  /* ---------- Scenario panel ---------- */
  .panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .panel-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .panel-head h1 { font-family: var(--f-head); font-weight: 600; font-size: 18px; margin: 0; }
  .panel-head p { margin: 2px 0 0; color: var(--grey); font-size: 12px; }
  .scenarios { overflow-y: auto; padding: 8px 0 16px; flex: 1; min-height: 0; }
  .sc-group { padding: 12px 16px 4px; font-family: var(--f-head); font-size: 13px; font-weight: 600; color: var(--grey); text-transform: uppercase; letter-spacing: .04em; }
  .sc { display: block; width: 100%; text-align: left; padding: 7px 16px 7px 20px; font-size: 13px; line-height: 1.35; border-left: 3px solid transparent; }
  .sc:hover { background: var(--hover); }
  .sc.on { background: #eaf1fb; border-left-color: var(--link); font-weight: 600; }
  .sc small { display: block; color: var(--grey); font-weight: 400; font-size: 12px; }
  .sc.tour { margin: 4px 12px 2px; width: calc(100% - 24px); border: 1px solid #d9d6fb; border-radius: var(--radius); background: var(--quest-bg); color: var(--quest); padding: 10px 12px; font-weight: 600; }
  .sc.tour.on { border-color: var(--quest); }
  .sc.tour small { color: var(--quest); opacity: .8; }
  .about { border-top: 1px solid var(--line); padding: 12px 16px 14px; background: var(--surface); font-size: 13px; line-height: 1.45; max-height: 38vh; overflow-y: auto; }
  .about h2 { font-family: var(--f-head); font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .about p { margin: 0 0 6px; }
  .about .w b { color: var(--works); }
  .about .x b { color: var(--watch); }
  .about .lean { color: var(--grey); }
  .about-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 5px 10px; font-size: 12px; background: var(--surface); }
  .btn:hover { border-color: var(--link); color: var(--link-dark); }
  .btn.primary { background: var(--quest); border-color: var(--quest); color: #fff; }
  .panel-toggle { position: fixed; left: 332px; bottom: 10px; z-index: 50; }
  .layout.panel-hidden ~ .panel-toggle { left: 10px; }

  /* ---------- App chrome ---------- */
  .app { display: grid; grid-template-rows: 48px 1fr; min-width: 0; min-height: 0; }
  .topnav { background: var(--nav); color: #fff; display: flex; align-items: center; gap: 28px; padding: 0 20px; }
  .brand { font-family: var(--f-head); font-weight: 600; font-size: 20px; letter-spacing: .02em; }
  .brand span { color: var(--brand); }
  .topnav nav { display: flex; gap: 24px; font-family: var(--f-head); font-size: 14px; letter-spacing: .06em; }
  .topnav nav a { color: #b9c1d6; text-decoration: none; }
  .topnav nav a.on { color: #fff; font-weight: 600; }
  .body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 0; }
  .side .org { padding: 0 16px 12px; color: var(--link-dark); font-size: 13px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .side a { display: flex; gap: 10px; align-items: center; padding: 8px 16px; color: var(--ink); text-decoration: none; font-size: 14px; }
  .side a.on { background: var(--hover); font-weight: 600; }
  .content { overflow: auto; padding: 18px 28px 80px; position: relative; min-width: 0; }
  .content-head { display: flex; align-items: center; gap: 24px; margin-bottom: 14px; }
  .content-head h2 { font-family: var(--f-head); font-weight: 400; font-size: 26px; margin: 0; flex: none; }
  .search-wrap { position: relative; width: 560px; max-width: 100%; margin-left: auto; }
  .field { display: flex; align-items: center; gap: 8px; height: 40px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); padding: 0 10px 0 12px; }
  .field:focus-within { border-color: var(--link); box-shadow: 0 0 0 3px rgba(74, 156, 183, .18); }
  .field input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; color: var(--ink); min-width: 0; background: transparent; }
  .field input::placeholder { color: var(--muted); }
  .field .clear { color: var(--grey); display: flex; }
  [hidden] { display: none !important; }
  .field .scope { background: #eaf1fb; color: var(--link-dark); border-radius: 4px; padding: 2px 6px; font-size: 12px; white-space: nowrap; }

  /* Mail list behind the menu */
  .maillist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .maillist div { display: grid; grid-template-columns: 180px 1fr 70px; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--grey); font-size: 13px; }
  .maillist div b { color: var(--ink); font-weight: 600; }

  /* ---------- Type-ahead menu ---------- */
  .menu { position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 20; padding: 4px 0; max-height: calc(100vh - 140px); overflow-y: auto; }
  .menu.wide { right: auto; width: 1000px; max-width: calc(100vw - 560px); }
  .menu-split { display: grid; grid-template-columns: 560px 1fr; }
  .menu-split > .preview { border-left: 1px solid var(--line); padding: 16px; }
  .glabel { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 4px; font-size: 12px; color: var(--grey); }
  .glabel button { color: var(--link); font-size: 12px; }
  .glabel button:hover { text-decoration: underline; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; min-height: 52px; position: relative; }
  .row:hover { background: var(--hover); }
  .row.hi { background: var(--highlight); }
  .row .txt { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 12px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .row .s b { color: var(--ink); font-weight: 700; }
  .row .meta { text-align: right; font-size: 12px; color: var(--grey); flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .row .src { font-size: 11px; display: inline-flex; gap: 3px; align-items: center; }
  .row .src svg.i { width: 11px; height: 11px; }
  .row .opens { color: var(--link-dark); font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
  .row .opens svg.i { width: 12px; height: 12px; }
  .row .acts { display: flex; gap: 4px; align-items: center; flex: none; }
  .iconbtn { width: 28px; height: 28px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); background: rgba(255,255,255,.7); border: 1px solid transparent; position: relative; }
  .iconbtn:hover { border-color: var(--line-strong); background: #fff; }
  .iconbtn[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: 34px; right: 0; background: #222; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; z-index: 5; }
  .aipill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 4px; border: 1px solid transparent; background: rgba(255,255,255,.85); color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .aipill svg.i { color: var(--link-dark); width: 15px; height: 15px; }
  .aipill:hover { border-color: var(--line-strong); background: #fff; }
  .aipill.blocked, .iconbtn.blocked { color: var(--muted); cursor: not-allowed; }
  .aipill.blocked svg.i, .iconbtn.blocked svg.i { color: var(--muted); }
  .iconbtn.ai svg.i { color: var(--link-dark); }
  .acts .sep { width: 1px; height: 18px; background: rgba(0,0,0,.12); margin: 0 2px; }
  .frow { display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  .frow:hover { background: var(--hover); }
  .frow.hi { background: var(--highlight); }
  .frow .grow { flex: 1; }
  .frow .k { color: var(--grey); font-size: 12px; }
  .frow code { font-family: var(--f-body); font-weight: 700; }
  .chips { display: flex; gap: 8px; padding: 10px 16px 6px; flex-wrap: wrap; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--grey); }
  .chip { border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 12px; font-size: 13px; background: #fff; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .chip:hover { border-color: var(--link); }
  .chip.on { background: var(--highlight); border-color: var(--highlight); }
  .chip.on svg.i { width: 12px; height: 12px; }
  .tabs { display: flex; gap: 20px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
  .tab { padding-bottom: 8px; font-size: 13px; color: var(--grey); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--link); }
  .divider { height: 1px; background: var(--line); margin: 4px 0; }
  .seeall { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--link); cursor: pointer; font-size: 14px; }
  .seeall:hover, .seeall.hi { background: var(--hover); }
  .seeall .k { margin-left: auto; color: var(--grey); font-size: 12px; }
  .more { padding: 2px 16px 8px 44px; }
  .more button { color: var(--link); font-size: 12px; }
  .more button:hover { text-decoration: underline; }
  .hint { padding: 8px 16px; font-size: 12px; color: var(--grey); }
  .note-line { padding: 8px 16px; font-size: 12px; color: var(--grey); font-style: italic; }
  .dym { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fffaf0; border-bottom: 1px solid var(--amber-line); font-size: 14px; animation: flash .35s ease; }
  .dym b { font-weight: 700; color: var(--link-dark); }
  .dym .k { margin-left: auto; font-size: 12px; color: var(--grey); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; }
  @keyframes flash { from { background: #ffe9b3; } to { background: #fffaf0; } }
  .indexing { display: flex; gap: 8px; align-items: center; background: var(--amber-bg); border: 1px solid var(--amber-line); margin: 6px 12px; padding: 8px 10px; border-radius: 4px; font-size: 12px; }
  .actlist .head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-weight: 600; border-bottom: 1px solid var(--line); }
  .actlist .head .k { margin-left: auto; font-weight: 400; color: var(--grey); font-size: 12px; }
  .ddmenu { position: absolute; right: 12px; top: 44px; width: 250px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 30; padding: 4px 0; }
  .ddmenu .frow { font-size: 13px; padding: 7px 12px; }
  .empty { padding: 18px 16px; color: var(--grey); font-size: 13px; }
  .preview h3 { font-family: var(--f-head); font-weight: 600; font-size: 17px; margin: 0 0 4px; }
  .preview .pm { color: var(--grey); font-size: 12px; margin-bottom: 12px; }
  .preview blockquote { margin: 0 0 14px; padding: 0; font-size: 13px; line-height: 1.5; }
  .preview .pa { display: flex; gap: 8px; align-items: center; }
  .solid { background: var(--nav); color: #fff; border-radius: 4px; padding: 5px 14px; font-size: 13px; }

  /* ---------- Results page ---------- */
  .rp-sum { display: flex; gap: 12px; align-items: baseline; color: var(--ink); font-size: 13px; margin: 2px 0 10px; }
  .rp-sum .fresh { color: var(--grey); font-size: 12px; }
  .rp-banner { font-size: 13px; margin: 0 0 10px; color: var(--grey); }
  .rp-banner a { color: var(--link); cursor: pointer; }
  .rp-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .rp-group { font-family: var(--f-head); font-size: 16px; margin: 18px 0 6px; }
  .rp-group span { color: var(--grey); font-family: var(--f-body); font-size: 12px; margin-left: 6px; }
  .rp-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rp-row .t { font-weight: 600; }
  .rp-row .s { font-size: 13px; margin: 3px 0; }
  .rp-row .s b { font-weight: 700; }
  .rp-row .a { font-size: 12px; color: var(--grey); display: flex; gap: 4px; align-items: center; }
  .rp-row .a svg.i { width: 11px; height: 11px; }
  .rp-showmore { color: var(--link); font-size: 13px; padding: 10px 0 0 28px; }

  /* ---------- Guided tour ---------- */
  .quest { position: fixed; right: 20px; bottom: 20px; width: 340px; background: #fff; border: 2px solid var(--quest); border-radius: 10px; box-shadow: var(--shadow); z-index: 60; padding: 14px 16px 12px; }
  .quest .qtop { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--quest); font-weight: 700; }
  .quest h3 { font-family: var(--f-head); font-weight: 600; font-size: 18px; margin: 6px 0 4px; }
  .quest p { margin: 0 0 8px; font-size: 13px; line-height: 1.45; }
  .quest kbd { display: inline-block; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-family: var(--f-body); font-size: 12px; background: var(--page); }
  .quest .pips { display: flex; gap: 4px; margin: 10px 0 8px; }
  .quest .pips i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .quest .pips i.done { background: var(--quest); }
  .quest .pips i.now { background: #9d97ef; }
  .quest .qbtns { display: flex; gap: 8px; justify-content: flex-end; }
  .quest .xp { color: var(--quest); font-weight: 700; }
  .quest.win { text-align: center; }
  .quest.win .trophy { font-size: 40px; line-height: 1; margin: 6px 0; }
  .quest .check { color: var(--works); font-weight: 700; }
  .tour-target { outline: 3px solid #8b84f0 !important; outline-offset: 3px; border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { outline-color: #8b84f0; } 50% { outline-color: rgba(139, 132, 240, .25); } }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
    .panel { max-height: 45vh; }
    .body { grid-template-columns: 1fr; }
    .side { display: none; }
    .content { padding: 16px; }
    .content-head { flex-wrap: wrap; }
    .search-wrap { width: 100%; }
    .menu.wide { width: auto; right: 0; max-width: none; }
    .menu-split { grid-template-columns: 1fr; }
    .menu-split > .preview { display: none; }
    .quest { left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body>
<div class="layout" id="layout">
  <aside class="panel" aria-label="Scenarios">
    <div class="panel-head">
      <h1>Search type-ahead</h1>
      <p>Deep dive 1 · pick a scenario, then click into the search box</p>
    </div>
    <div class="scenarios" id="scenarios"></div>
    <div class="about" id="about" data-testid="scenario-about"></div>
  </aside>
  <div class="app">
    <header class="topnav">
      <div class="brand">PRE<span>VEIL</span></div>
      <nav><a href="#" class="on">MAIL</a><a href="#">DRIVE</a><a href="#">AI</a><a href="#">ADMIN</a></nav>
    </header>
    <div class="body">
      <aside class="side" id="side"></aside>
      <main class="content" id="content">
        <div class="content-head">
          <h2 id="pageTitle">Inbox</h2>
          <div class="search-wrap" id="searchWrap">
            <div class="field" data-testid="search-field">
              <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <span class="scope" id="scope" hidden></span>
              <input id="q" autocomplete="off" spellcheck="false" aria-label="Search">
              <button class="clear" id="clear" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            </div>
            <div id="menu"></div>
          </div>
        </div>
        <div id="page"></div>
      </main>
    </div>
  </div>
</div>
<button class="btn panel-toggle" id="panelToggle">Hide scenarios</button>
<div id="quest"></div>

<script>
/*
 * Design Rail lite: connects any HTML prototype to the Design Rail extension.
 * Paste into a <script> tag (no build step, no dependencies).
 *
 *   DesignRail.setup({
 *     project: { id: 'checkout-redesign', name: 'Checkout redesign' },
 *     screens: [{ name: 'Cart', path: '/cart' }, { name: 'Payment', path: '/payment' }],
 *     getPath: () => currentScreen,              // optional, for state-based "screens"
 *     navigate: (path) => showScreen(path),      // optional
 *   })
 *   const layout = DesignRail.variant('cart.layout', { label: 'Layout', options: ['List', 'Cards'], group: 'Cart' })
 *   const promo = DesignRail.flag('cart.promo', { label: 'Promo banner', group: 'State' })
 *   DesignRail.onChange(render)                  // re-render when a reviewer switches something
 *
 * Protocol: packages/design-rail/src/protocol.ts
 */
;(function () {
  if (window.DesignRail) return
  var PROTOCOL = 'design-rail'
  var STORAGE_KEY = 'design-rail:values'
  var defs = {}
  var order = []
  var values = {}
  var listeners = []
  var meta = { project: {}, screens: [], scenarios: [], getPath: null, navigate: null }
  var scheduled = false

  function decode(param) {
    var out = {}
    param.split(',').forEach(function (pair) {
      var i = pair.indexOf(':')
      if (i <= 0) return
      var raw = decodeURIComponent(pair.slice(i + 1))
      out[decodeURIComponent(pair.slice(0, i))] = raw === 'on' ? true : raw === 'off' ? false : raw
    })
    return out
  }

  try {
    var fromUrl = new URLSearchParams(location.search).get('v')
    values = fromUrl ? decode(fromUrl) : JSON.parse(sessionStorage.getItem(STORAGE_KEY) || '{}')
  } catch (e) {
    values = {}
  }

  function coerce(def, raw) {
    if (raw === undefined) return def.default
    if (def.kind === 'flag') return raw === true || raw === '1' || raw === 'true' || raw === 'on'
    return def.options.indexOf(String(raw)) >= 0 ? String(raw) : def.default
  }

  function get(id) {
    return defs[id] ? coerce(defs[id], values[id]) : values[id]
  }

  function changed() {
    var out = {}
    Object.keys(values).forEach(function (id) {
      var def = defs[id]
      var value = def ? coerce(def, values[id]) : values[id]
      if (!def || value !== def.default) out[id] = value
    })
    return out
  }

  function path() {
    if (meta.getPath) return meta.getPath()
    return location.hash.indexOf('#/') === 0 ? location.hash.slice(1).split('?')[0] : location.pathname
  }

  function publish() {
    if (scheduled) return
    scheduled = true
    setTimeout(function () {
      scheduled = false
      var here = path()
      window.postMessage(
        {
          protocol: PROTOCOL,
          version: 1,
          from: 'page',
          type: 'state',
          state: {
            project: meta.project,
            path: here,
            screens: meta.screens,
            scenarios: meta.scenarios,
            defs: order.map(function (id) {
              return defs[id]
            }),
            mounted: order.filter(function (id) {
              return !defs[id].screen || defs[id].screen === here
            }),
            values: changed(),
          },
        },
        '*',
      )
    }, 0)
  }

  function commit(next) {
    values = next
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(values))
    } catch (e) {
      // storage unavailable
    }
    listeners.forEach(function (cb) {
      cb()
    })
    publish()
  }

  function register(def) {
    if (!defs[def.id]) order.push(def.id)
    defs[def.id] = def
    publish()
    return get(def.id)
  }

  window.addEventListener('message', function (event) {
    var m = event.data
    if (event.source !== window || !m || m.protocol !== PROTOCOL || m.from !== 'extension') return
    if (m.type === 'hello') publish()

// ===================================================================
// UI state
// ===================================================================
const S = {
  scenario: null, open: false, query: '', hi: -1, view: 'menu', // 'menu' | 'actions'
  moreFor: null, page: 'inbox', rpGroup: null, menuGroup: null, refine: null, srcFilter: null, playing: null,
  scopeFolder: false, forceExact: false, toast: null,
};
const $ = id => document.getElementById(id);
const input = $('q');

function setValues(values) {
  window.postMessage({ protocol: 'design-rail', version: 1, from: 'extension', type: 'setMany', values: Object.assign({}, values) }, '*');
}

function applyScenario(sc, opts = {}) {
  S.scenario = sc.id;
  try { sessionStorage.setItem('ta:scenario', sc.id); } catch (e) {}
  clearInterval(S.playing); S.playing = null;
  setValues(sc.values);
  Object.assign(S, { open: false, query: '', hi: -1, view: 'menu', moreFor: null, page: 'inbox', rpGroup: null, menuGroup: null, refine: null, srcFilter: null, scopeFolder: false, forceExact: false });
  input.value = '';
  if (sc.tour) { Tour.start(); }
  else if (!Tour.finishesWith(sc.id)) Tour.stop();
  setTimeout(() => {
    if (sc.query != null) { input.value = sc.query; S.query = sc.query; S.open = true; S.menuGroup = sc.group || null; S.hi = sc.hi ?? -1; input.focus(); }
    else if (sc.play) { play(sc.play); }
    else if (sc.focus) { input.focus(); S.open = true; }
    render();
  }, 30);
  renderPanel();
  Tour.event('scenario', sc.id);
}

function play(text) {
  clearInterval(S.playing);
  input.value = ''; S.query = ''; S.open = true; S.hi = -1; input.focus();
  let i = 0;
  S.playing = setInterval(() => {
    i++; input.value = text.slice(0, i); S.query = input.value; S.hi = -1; render();
    if (i >= text.length) { clearInterval(S.playing); S.playing = null; renderPanel(); }
  }, 380);
  render();
}

// ===================================================================
// Rendering: panel
// ===================================================================
function renderPanel() {
  const html = SCENARIOS.map(sec => `<div class="sc-group">${esc(sec.section)}</div>` + sec.items.map(sc =>
    `<button class="sc ${sc.tour ? 'tour' : ''} ${S.scenario === sc.id ? 'on' : ''}" data-sc="${sc.id}" data-testid="scenario-${sc.id}">${esc(sc.name)}${sc.sub ? `<small>${esc(sc.sub)}</small>` : ''}</button>`).join('')).join('');
  $('scenarios').innerHTML = html;
  const sc = ALL_SC.find(x => x.id === S.scenario) || ALL_SC[1];
  const a = sc.about || {};
  $('about').innerHTML = `<h2>${esc(a.title || sc.name)}</h2>
    ${a.body ? `<p>${esc(a.body)}</p>` : ''}
    ${a.works ? `<p class="w"><b>Works:</b> ${esc(a.works)}</p>` : ''}
    ${a.watch ? `<p class="x"><b>Watch out:</b> ${esc(a.watch)}</p>` : ''}
    <div class="about-actions">
      ${sc.play ? `<button class="btn" data-replay>${S.playing ? 'Typing…' : 'Replay the typing'}</button>` : ''}
      ${sc.query != null || sc.focus ? `<button class="btn" data-reset>Reset this scenario</button>` : ''}
      <button class="btn" data-copylink>Copy link to this scenario</button>
    </div>`;
}
$('scenarios').addEventListener('click', e => {
  const b = e.target.closest('[data-sc]'); if (!b) return;
  applyScenario(ALL_SC.find(x => x.id === b.dataset.sc));
});
$('about').addEventListener('click', e => {
  const sc = ALL_SC.find(x => x.id === S.scenario) || ALL_SC[1];
  if (e.target.closest('[data-replay]')) play(sc.play);
  if (e.target.closest('[data-reset]')) applyScenario(sc);
  if (e.target.closest('[data-copylink]')) {
    const url = location.origin + location.pathname + '#' + sc.id;
    navigator.clipboard?.writeText(url).then(() => { e.target.textContent = 'Link copied'; setTimeout(renderPanel, 1500); }).catch(() => { prompt('Copy this link', url); });
  }
});
$('panelToggle').addEventListener('click', () => {
  const l = $('layout'); l.classList.toggle('panel-hidden');
  $('panelToggle').textContent = l.classList.contains('panel-hidden') ? 'Show scenarios' : 'Hide scenarios';
});

function srcHtml(it, highlighted) {
  if (!it.src) return '';
  const outside = OUTSIDE(it.src);
  if (V.source === 'In the second line') return '';
  const icon = V.source === 'Mark what leaves PreVeil' && outside ? ic('ext') : '';
  return `<span class="src">${esc(it.src)}${icon}</span>`;
}
function snippetHtml(it, tokens) {
  const s = boldify(it.s, tokens);
  if (V.source === 'In the second line' && it.src) return `${esc(it.src)} · ${esc(it.where || '')} · ${s}`;
  return s;
}
function canAskAI(it) {
  if (V.ai === 'Not in the menu') return false;
  return it.src === 'PreVeil' || it.src === 'Zoom' || it.src === 'Kiwi';
}

  const map = { O365: it.g === 'Mail' ? 'Outlook' : 'OneDrive', Gmail: 'Gmail', Slack: 'Slack', Zoom: 'Zoom', Kiwi: 'Kiwi' };

function rowButtons(it) {

  else if (it.g === 'Documents') { b.push(`<button class="iconbtn" data-act="preview" data-tip="Preview (Space)">${ic('eye')}</button>`); b.push(`<button class="iconbtn" data-act="folder" data-tip="Show in folder">${ic('folder')}</button>`); }
  else if (it.g === 'Mail') b.push(`<button class="iconbtn" data-act="reply" data-tip="Reply">${ic('reply')}</button>`);
  b.push(`<button class="iconbtn" data-act="more" data-tip="More actions (→)">${ic('more')}</button>`);

function rowHtml(it, idx, tokens) {
  const hi = idx === S.hi;
  let right;
  if (it.k === 'person') right = `<span class="meta"><span class="opens">Show mail from ${esc(it.first)}</span>${srcHtml(it)}</span>`;

  else right = `<span class="meta">${esc(it.d || '')}${srcHtml(it)}</span>`;

function actionsFor(it) {

  else if (it.g === 'Documents') L.push(ext('Open in OneDrive'), ext('Show its folder in OneDrive'), { label: 'Copy link', icon: 'link' });

function resultsHtml() {

  }

    if (S.srcFilter) gi = gi.filter(x => x.src === S.srcFilter);

      const left = gi.length - per;

  }

  return h;
}

function openResults(group) {
  S.rpQuery = S.query.trim() || 'cmmc assessment evid'; S.rpGroup = group || null; S.page = 'results'; S.open = false; S.forceExact = false;
  input.blur(); render(); Tour.event('results', group);
}
input.addEventListener('focus', () => { S.open = true; render(); Tour.event('focus'); });
input.addEventListener('click', () => { if (!S.open) { S.open = true; render(); } Tour.event('focus'); });
input.addEventListener('input', () => { S.query = input.value; S.hi = -1; S.view = 'menu'; S.moreFor = null; S.refine = null; S.srcFilter = null; if (!S.query.trim()) S.menuGroup = null; render(); Tour.event('type', S.query); });
$('clear').addEventListener('click', () => { input.value = ''; S.query = ''; S.menuGroup = null; S.hi = -1; input.focus(); render(); });
document.addEventListener('mousedown', e => {
  if (!e.target.closest('#searchWrap') && !e.target.closest('.quest')) { if (S.open) { S.open = false; S.moreFor = null; render(); } }
});
input.addEventListener('keydown', e => {
  if (!S.open) { S.open = true; render(); }
  const n = NAV.length;
  if (e.key === 'ArrowDown') { e.preventDefault(); S.hi = Math.min(n - 1, S.hi + 1); S.moreFor = null; render(); Tour.event('down', S.hi); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); S.hi = Math.max(-1, S.hi - 1); S.moreFor = null; render(); }
  else if (e.key === 'ArrowRight' && S.view === 'menu' && NAV[S.hi] && NAV[S.hi].it && V.actions !== 'Preview beside the menu') {
    e.preventDefault(); NAVSNAP = NAV.slice(); S.hiSnap = S.hi; S.hiBack = S.hi; S.view = 'actions'; S.hi = 0; render(); Tour.event('actions');
  }
  else if ((e.key === 'ArrowLeft' || e.key === 'Escape') && S.view === 'actions') { e.preventDefault(); S.view = 'menu'; S.hi = S.hiBack; render(); Tour.event('back'); }
  else if (e.key === 'Escape') { if (S.moreFor) S.moreFor = null; else if (S.menuGroup) { S.menuGroup = null; } else { S.open = false; input.blur(); } render(); }
  else if (e.key === 'Tab' && !e.shiftKey) {
    const d = NAV.find(x => x.kind === 'dym');
    if (d) { e.preventDefault(); input.value = d.text; S.query = d.text; S.hi = -1; render(); }
    else if (V.firstClick === 'Inside a folder' && !S.query) { e.preventDefault(); S.scopeFolder = !S.scopeFolder; render(); }
  }
  else if (e.key === 'Enter') { e.preventDefault(); activate(S.hi); }
  else if (e.key === ' ' && NAV[S.hi] && NAV[S.hi].it && NAV[S.hi].it.g === 'Documents' && !S.query.endsWith(' ') && false) {}
});
function activate(i) {
  const e = NAV[i];
  if (!e) { if (S.query.trim()) openResults(S.menuGroup); return; }
  if (e.kind === 'fill' || e.kind === 'dym') { input.value = e.text; S.query = e.text; S.hi = -1; S.view = 'menu'; input.focus(); render(); Tour.event('type', S.query); }
  else if (e.kind === 'seeall') openResults(e.group);
  else if (e.kind === 'item') toast(`Would open “${e.it.t}”${e.it.src && OUTSIDE(e.it.src) && e.it.src !== 'PreVeil AI' && e.it.k !== 'person' ? ' in ' + openLabel(e.it) : ''}`);
  else if (e.kind === 'action') toast(e.a.disabled ? e.a.label : `Would do: ${e.a.label}`);
  else if (e.kind === 'refine') { S.refine = S.refine === e.label ? null : e.label; S.hi = -1; render(); }
  else if (e.kind === 'scopeFolder') { S.scopeFolder = true; render(); }
  else if (e.kind === 'askai') toast('Would open the AI side panel with this question and suggested topics');
}
$('menu').addEventListener('mousedown', e => e.preventDefault()); // keep focus in the input
$('menu').addEventListener('click', e => {
  const t = e.target;
  const chip = t.closest('[data-chip]');
  if (chip) {
    const g = chip.dataset.chip === 'All' ? null : chip.dataset.chip;
    if (V.chipClick === 'Opens the full results page' && g && V.second !== 'Tabs + filter chips' ) { openResults(g); return; }
    S.menuGroup = S.menuGroup === g ? null : g; S.refine = null; S.srcFilter = null; S.hi = -1; render(); Tour.event('menuGroup', g); return;
  }
  const jump = t.closest('[data-jump]'); if (jump) { openResults(jump.dataset.jump); return; }
  const grp = t.closest('[data-group]'); if (grp) { S.menuGroup = grp.dataset.group; S.hi = -1; render(); return; }
  const sc = t.closest('[data-scopechip]'); if (sc) { const map = { Mail: 'mail', Documents: 'docs', Chats: 'chats', Other: 'other' }; input.value = `in:${map[sc.dataset.scopechip]} `; S.query = input.value; render(); return; }
  if (t.closest('[data-scopefolder]')) { S.scopeFolder = true; render(); return; }
  const src = t.closest('[data-src]'); if (src) { S.srcFilter = S.srcFilter === src.dataset.src ? null : src.dataset.src; render(); return; }
  const ref = t.closest('[data-refine]'); if (ref) { S.refine = S.refine === ref.dataset.refine ? null : ref.dataset.refine; render(); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const row = act.closest('[data-item]'); const id = row && row.dataset.item;
    if (act.dataset.act === 'more') { S.moreFor = S.moreFor === id ? null : id; render(); Tour.event('more'); return; }
    const it = ITEMS.find(x => x.id === id) || {};
    const msgs = { open: `Would open “${it.t}” in ${openLabel(it)}`, preview: `Would preview “${it.t}”`, folder: 'Would show it in its folder', reply: 'Would start a reply', ai: `Would open the AI side panel about “${it.t}” with suggested topics`, aiblocked: 'Search can’t read inside CAD drawings, so AI can’t either.' };
    toast(msgs[act.dataset.act]); return;
  }
  const al = t.closest('[data-act-label]'); if (al) { toast('Would do: ' + al.dataset.actLabel); S.moreFor = null; render(); return; }
  const nav = t.closest('[data-nav]'); if (nav) { const i = +nav.dataset.nav; if (S.hi === i || NAV[i].kind !== 'item') activate(i); else { S.hi = i; render(); } return; }
  const sa = t.closest('[data-seeall]'); if (sa) openResults(sa.dataset.seeall || null);
});
$('menu').addEventListener('mouseover', e => {
  const nav = e.target.closest('[data-nav]'); if (!nav || S.moreFor) return;
  const i = +nav.dataset.nav; if (i !== S.hi && NAV[i] && NAV[i].kind === 'item') { S.hi = i; render(); }
});
$('page').addEventListener('click', e => {
  const g = e.target.closest('[data-rpgroup]'); if (g) { S.rpGroup = g.dataset.rpgroup || null; renderPage(); Tour.event('rpgroup', S.rpGroup); return; }
  if (e.target.closest('[data-exact]')) { S.forceExact = true; renderPage(); }
});

let toastTimer;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#222;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;z-index:70;max-width:90vw'; document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

// ===================================================================
// Guided tour: steps that move on when you do the thing
// ===================================================================
const Tour = (() => {
  const steps = [
    { title: 'Click into the search box', body: 'Everything starts here. Click the search box at the top.', target: '[data-testid="search-field"]', on: (ev) => ev === 'focus' },
    { title: 'Look before you type', body: 'Before you type, it shows what you opened lately, from every app, plus shortcuts to Mail, Documents, Chats and Other. We never keep what people type (R45), so there are no “recent searches”.', target: '[data-testid="typeahead-menu"]', next: true },
    { title: 'Type a search', body: 'Type <b>cmmc assessment evid</b>. Results update as you type.', target: '[data-testid="search-field"]', on: (ev, v) => ev === 'type' && /cmmc a/i.test(v || ''), help: 'Type it for me' },
    { title: 'Read the groups', body: 'Results are grouped: Mail, Documents, Chats, Other. Each row says where it lives (PreVeil, O365, Gmail, Slack, Zoom, Kiwi). Press <kbd>↓</kbd> twice to move down.', target: '[data-testid="typeahead-menu"]', on: (ev, v) => ev === 'down' && v >= 1 },
    { title: 'Find the actions', body: 'The highlighted row swaps its date for buttons. Press <kbd>→</kbd> to see every action for that result.', target: '.row.hi', on: (ev) => ev === 'actions' },
    { title: 'Come back', body: 'Actions change with the type of result. Press <kbd>←</kbd> to go back to the results.', target: '.actlist', on: (ev) => ev === 'back' },
    { title: 'Jump to the full list', body: 'Click <b>Mail</b> in the chips at the top of the menu. It opens the full results page, already filtered.', target: '[data-testid="chip-mail"]', on: (ev) => ev === 'results' },
    { title: 'Try the other options', body: 'Every option from the Figma deep dive is a scenario in the left panel. Pick <b>Live “did you mean”: changes on every keystroke</b> under 4 · Did you mean.', target: '[data-testid="scenario-d-flicker"]', on: (ev, v) => ev === 'scenario' && v === 'd-flicker' },
  ];
  let i = -1; let active = false;
  function start() { active = true; i = 0; draw(); }
  function stop() { active = false; i = -1; $('quest').innerHTML = ''; clearHighlight(); }
  function advance() { i++; draw(); render(); }
  function event(ev, v) {
    if (!active || i < 0 || i >= steps.length) return;
    const s = steps[i];
    if (s.on && s.on(ev, v)) { setTimeout(advance, 250); }
  }
  function clearHighlight() { document.querySelectorAll('.tour-target').forEach(n => n.classList.remove('tour-target')); }
  function highlight() {
    clearHighlight();
    if (!active || i < 0 || i >= steps.length) return;
    const el = document.querySelector(steps[i].target); if (el) el.classList.add('tour-target');
  }
  function draw() {
    const q = $('quest');
    if (!active) { q.innerHTML = ''; return; }
    if (i >= steps.length) {
      q.innerHTML = `<div class="quest win" data-testid="tour"><div class="qtop"><span>Tour complete</span></div><div class="trophy">🏆</div><h3>You’re ready to explore</h3><p>Keep exploring scenarios on the left. Every one starts from search results grouped by object and changes one thing.</p><div class="qbtns" style="justify-content:center"><button class="btn" data-q="restart">Start over</button><button class="btn primary" data-q="close">Close</button></div></div>`;
      clearHighlight(); return;
    }
    const s = steps[i];
    q.innerHTML = `<div class="quest" data-testid="tour">
      <div class="qtop"><span>Step ${i + 1} of ${steps.length}</span></div>
      <h3>${s.title}</h3><p>${s.body}</p>
      <div class="pips">${steps.map((_, n) => `<i class="${n < i ? 'done' : n === i ? 'now' : ''}"></i>`).join('')}</div>
      <div class="qbtns">
        <button class="btn" data-q="quit">Quit tour</button>
        ${s.help ? `<button class="btn" data-q="help">${s.help}</button>` : ''}
        ${s.next ? `<button class="btn primary" data-q="next">Got it</button>` : `<button class="btn" data-q="skip">Skip</button>`}
      </div></div>`;
    highlight();
  }
  $('quest').addEventListener('mousedown', e => e.preventDefault());
  $('quest').addEventListener('click', e => {
    const a = e.target.closest('[data-q]'); if (!a) return;
    const k = a.dataset.q;
    if (k === 'next' || k === 'skip') { advance(); if (i === 2 || i === 3) input.focus(); }
    if (k === 'quit' || k === 'close') { stop(); }
    if (k === 'restart') applyScenario(ALL_SC[0]);
    if (k === 'help') { play('cmmc assessment evid'); const wait = setInterval(() => { if (!S.playing) { clearInterval(wait); event('type', S.query); } }, 200); }
  });
  const finishesWith = id => active && i === steps.length - 1 && steps[i].on('scenario', id);
  return { start, stop, event, highlight, finishesWith };
})();

// ===================================================================
// Boot
// ===================================================================
DesignRail.setup({
  project: { id: 'semantic-search-typeahead', name: 'Semantic search: type-ahead menu' },
  screens: [{ name: 'Inbox with type-ahead', path: '/inbox' }, { name: 'Search results', path: '/results' }],
  getPath: () => '/' + (S.page === 'results' ? 'results' : 'inbox'),
  scenarios: ALL_SC.filter(s => !s.tour).map(s => ({ name: s.name, description: s.about && s.about.body, values: s.values })),
});
DesignRail.onChange(() => { render(); renderPanel(); DesignRail.screenChanged(); });
const fromHash = ALL_SC.find(s => s.id === location.hash.slice(1));
let saved = null; try { saved = sessionStorage.getItem('ta:scenario'); } catch (e) {}
readVariants();
const startSc = fromHash || ALL_SC.find(s => s.id === saved) || ALL_SC.find(s => s.id === 'baseline');
if (new URLSearchParams(location.search).get('v') && !fromHash) { S.scenario = null; renderPanel(); render(); }
else applyScenario(startSc);
window.addEventListener('hashchange', () => { const s = ALL_SC.find(x => x.id === location.hash.slice(1)); if (s) applyScenario(s); });
</script>
